    <link rel="stylesheet" href="owl.carousel.min.css">

    <style>
        .slider{
            margin-bottom:20px;
            position:relative;
        }
        .slider .owl-item.active.center .slider-card{
            transform: scale(1.15);
            opacity:1;
            background-color: #ccc;
            background: -webkit-linear-gradient(to left, #060709, rgb(51 48 48 / 40%), #060709);
            color:#fff;
        }
    </style>
</head>
<body>
    <section id="slider">
        <div class="container">
            <h1>
                responsive
            </h1>
            <div class="slider">
                <div class="owl-carousel">
                    <div class="slider-card">
                        <div>
                            <img src="images/program-feature.png" alt="" srcset="">
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </section>


<script>
$(document).ready(function(){
    $('.owl-carousel').owlCarousel({
        loop:true,
        margin:10,
        responsiveClass:true,
        responsive:{
            0:{
                items:1,
                nav:true
            },
            600:{
                items:3,
                nav:false
            },
            1000:{
                items:5,
                nav:true,
                loop:false
            }
        }
    })

});
</script>
