  <style>
body {
  padding: 0;
  margin: 50px 0 0 0;
  background: white;
}

h2 {
  color: #333;
  text-align: center;
}

section {
  width: 75%;
  margin: auto;
}

.divider {
  width: 75%;
  margin: 100px auto;
  height: 2px;
  background-color: #333;
}

.item {
  height: 10rem;
  padding: 1rem;
  opacity: 1;
  transition: .4s ease all;
  margin: 0 20px;
  transform: scale(0.9);
}

.owl .item {
  background: #4DC7A0;
}

.slick .item {
  background: #3498db;
}

.active .item, .slick-center {
  opacity: 1;
  transform: scale(1);
}

.owl-controls {
  position: absolute;
  margin-top: 300px;
}

    </style>

<script>
  $('.owl-carousel').owlCarousel({
    stagePadding: 200,
    loop:true,
    items:1,
    lazyLoad: true,
    autoplay: true,
    autoplaySpeed: 2000,
    autoplayTimeout: 5000,
    autoplayHoverPause: true
})

$('.slick-carousel').slick({
  centerMode: true,
  slidesToShow: 3,
  dots: true,
  autoplay: true,
  autoplaySpeed: 3000,
  pauseOnHover: true,
  pauseOnDotsHover: true,
  edgeFriction: 0.05,
  infinite: true, 
    responsive: [
    {
      breakpoint: 1024,
      settings: {
        slidesToShow: 1
      }
    }]
});
</script>
